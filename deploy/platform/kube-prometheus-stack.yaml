# Prometheus + Alertmanager + Grafana + kube-state-metrics + node-exporter.
# Sized for a laptop; retention is short on purpose.

# kind runs these control-plane components bound to 127.0.0.1, so they cannot
# be scraped; leaving them on would only produce permanently-firing alerts.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeProxy: false

prometheus:
  prometheusSpec:
    # Pick up ServiceMonitors/PrometheusRules from every namespace (the app
    # chart ships its own), not only ones created by this release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 3d
    scrapeInterval: 15s
    evaluationInterval: 15s
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
  config:
    route:
      receiver: "null"
      group_by: ["alertname", "namespace", "service"]
      routes:
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
    receivers:
      - name: "null"

grafana:
  admin:
    # Created by scripts/create-secrets.sh; never stored in git.
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  # Operator UIs are not exposed through the ingress; use kubectl port-forward.
  ingress:
    enabled: false
  # No phoning home: no update checks, no plugin downloads at startup.
  grafana.ini:
    analytics:
      reporting_enabled: false
      check_for_updates: false
      check_for_plugin_updates: false
    plugins:
      preinstall_disabled: true
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 512Mi
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      url: http://loki.observability.svc:3100
      jsonData:
        # A trace_id in a log line becomes a link to the trace in Tempo.
        derivedFields:
          - name: trace_id
            matcherRegex: '"trace_id":"(\w+)"'
            url: "$${__value.raw}"
            datasourceUid: tempo
    - name: Tempo
      uid: tempo
      type: tempo
      url: http://tempo.observability.svc:3200
      jsonData:
        # From a span, jump to the logs written while handling it.
        tracesToLogsV2:
          datasourceUid: loki
          spanStartTimeShift: "-5m"
          spanEndTimeShift: "5m"
          filterByTraceID: true
          customQuery: true
          query: '{app="urlshortener"} |= "$${__trace.traceId}"'
        serviceMap:
          datasourceUid: prometheus
        nodeGraph:
          enabled: true

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 16Mi

prometheusOperator:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
