{{- $fullname := include "urlshortener.fullname" . -}}
{{- $sel := dict "root" . "component" "web" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}-web
  labels:
    {{- include "urlshortener.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
automountServiceAccountToken: false
---
# Static React build served by unprivileged nginx. Stateless, so a Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-web
  labels:
    {{- include "urlshortener.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "urlshortener.selectorLabels" $sel | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "urlshortener.selectorLabels" $sel | nindent 8 }}
        app.kubernetes.io/version: {{ include "urlshortener.version" . | quote }}
    spec:
      serviceAccountName: {{ $fullname }}-web
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "urlshortener.selectorLabels" $sel | nindent 14 }}
      containers:
        - name: web
          image: {{ include "urlshortener.image" (dict "root" . "repository" .Values.web.repository) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            {{- include "urlshortener.containerSecurityContext" . | nindent 12 }}
          # nginx needs a few writable paths; everything else is read-only.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: cache
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-web
  labels:
    {{- include "urlshortener.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    {{- include "urlshortener.selectorLabels" $sel | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.web.port }}
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fullname }}-web
  labels:
    {{- include "urlshortener.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  minAvailable: {{ .Values.web.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "urlshortener.selectorLabels" $sel | nindent 6 }}
